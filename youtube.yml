# 監視するYouTubeチャンネル。
#
# **[未選定] チャンネルIDが必要なので、こちらでは決められない。**
# 見たいチャンネルが決まったら、次の手順で `id` を調べて追記する。
#
# 1. チャンネルのページを開く
# 2. ページのソースを表示し、`channelId` を検索する（`UC` で始まる24文字）
# 3. 下の例の形式で1行足す
#
# 例:
#   - { id: some_channel, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCxxxxxxxxxxxxxxxxxxxxxx", category: ai }
#
# 動画は本文が無いので、Geminiに要約させたものを本文として扱う（FR-1）。
# 空のままでも朝の処理は動く。YouTubeを使わないだけ。
