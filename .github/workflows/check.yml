# 自己診断。全外部依存を1回ずつ叩いて可否を一覧表示する（FR-10）。
# ✗があっても止めず、該当機能を無効化して継続する。
#
# 第1段階では pytest と simulate も動かし、外部通信なしで全体が通ることを見る。

name: check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    # 1回10分ほどかかる。コードに関係ない push（記録・ドキュメント・Workers）では回さない。
    # 無料枠（月2,000分）を開発の push だけで削らないため（2026-10-30）
    paths-ignore:
      - "**/*.md"
      - "workers/**"
  # 週1回、実キーで全部品を点検し、動かないものがあれば Slack へ1通知らせる。
  # 鍵の期限切れなどを、朝の処理が止まる前に見つけるため（2026-10-30）
  schedule:
    - cron: "0 22 * * 0"    # 月曜 07:00 Asia/Tokyo

# 続けて push したとき、古い検証は取り消して新しいものだけ回す
concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Tokyo
  PYTHONUNBUFFERED: "1"      # 進捗をその場でログへ出す。無いと打ち切り時に何も残らない
  # 公開リポジトリのログは誰でも読める。失敗理由から中身を落とす（src/pipeline.py）
  MORNING_PAPER_PUBLIC_LOG: "1"

jobs:
  offline:
    name: 外部通信なしの検証
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 3.12 の用意
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存の導入
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: 日本語フォントの導入
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Chromium の導入
        run: python -m playwright install --with-deps chromium

      - name: 自動テスト
        run: python -m pytest -q

      - name: 3日分の連続実行
        run: python -m src.simulate full

      - name: 縮退の確認
        run: python -m src.simulate morning --reset --fail stooq,claude

      - name: 探索の確認
        run: python -m src.simulate morning --reset --empty


  diagnose:
    name: 外部依存の自己診断
    runs-on: ubuntu-latest
    # 手動起動と週1回の点検で動かす
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 10
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 非公開データの取得
        # 既読の記録・本人の像は公開リポジトリに置かず、非公開の morning-paper-data
        # から取る（2026-10-31 公開化）。state/ と discovered_sources.yml はここを指す
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kage-goodworks/morning-paper-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: private
          persist-credentials: true

      - name: 非公開データをつなぐ
        run: |
          ln -sfn private/state state
          ln -sf private/discovered_sources.yml discovered_sources.yml

      - name: Python 3.12 の用意
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: 依存の導入
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Claude Code の導入
        # 定額プランのトークン（CLAUDE_CODE_OAUTH_TOKEN）は Claude Code 経由で
        # しか使えないため、非対話モード（claude -p）を子プロセスで呼ぶ。
        run: npm install -g @anthropic-ai/claude-code@2 && claude --version

      - name: 自己診断
        env:
          # APIキーがあればそちらを優先。片方だけでも動く。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
        # 点検では Slack に試しの投稿をしない。動かない部品があれば1通だけ知らせる
        run: python -m src.check --notify
