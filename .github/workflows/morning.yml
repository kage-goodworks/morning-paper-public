# 毎朝の収集と一覧の投稿。
#
# JST 05:00 に一覧が届いている状態を目標に、cron の遅延を見込んで 04:40 に起動する
# （制約）。cron は UTC 指定なので 19:40 UTC = 04:40 JST（前日）。
#
# **動作未確認。**第1段階は外部接続を持たないため、このワークフローは
# 記述のみで検証していない。

name: morning

on:
  # 主: Cloudflare Workers の Cron Trigger（04:40 JST）からの repository_dispatch。
  # GitHub の schedule は混雑時に数時間遅れるため、05:30 の保険に下げる。
  # その日の一覧がすでに出ていれば、朝の処理は何もせず終わる。
  repository_dispatch:
    types: [morning]
  schedule:
    - cron: "30 20 * * *"   # 05:30 Asia/Tokyo（保険）
  workflow_dispatch:

permissions:
  contents: write           # やり直しの起動（repository_dispatch）。state は非公開側へ deploy key で push

# 朝・記事化・週次は同じ列に並べて常に1つずつ動かす。3つとも state/ を
# 書く（outbox.json は共通）ので、どれか2つが重なると push が競合して
# 記録が残らない。重なるのは稀で、待ちは数分。
# 朝の処理だけの列（記事化の待ちを取り消さないよう、記事化とは分ける。2026-10-30）
concurrency:
  group: morning-paper-morning
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo            # NFR-4
  PYTHONUNBUFFERED: "1"      # 進捗をその場でログへ出す。無いと打ち切り時に何も残らない
  # 公開リポジトリのログは誰でも読める。失敗理由から中身を落とす（src/pipeline.py）
  MORNING_PAPER_PUBLIC_LOG: "1"

jobs:
  # 今日の一覧がもう出ていれば、重い準備をせずに数秒で終わる。朝の処理は 4:40 のほかに
  # 6:00・7:30（Workers の Cron）と 5:30（GitHub の schedule）にも起動し、4:40 が
  # 何かで動かなかった日でも一覧が出るようにする（2026-10-30）
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: 非公開データの取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kage-goodworks/morning-paper-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: private
          sparse-checkout: state
      - name: 今日の一覧の確認
        id: check
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          done=$(python3 -c "import json,sys;d=json.load(open('private/state/outbox.json',encoding='utf-8'));t=sys.argv[1];held=any(p.get('list_date')==t for p in d.get('pending') or []);print('yes' if (d.get('listed_messages') or {}).get(t) and not held else 'no')" "$today" 2>/dev/null || echo no)
          echo "今日（$today）の一覧: $done"
          if [ "$done" = "yes" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  morning:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15     # NFR-6
    steps:
      # サードパーティActionはcommit SHAで固定する（NFR-3）
      - name: リポジトリの取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 非公開データの取得
        # 既読の記録・本人の像は公開リポジトリに置かず、非公開の morning-paper-data
        # から取る（2026-10-31 公開化）。state/ と discovered_sources.yml はここを指す
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kage-goodworks/morning-paper-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: private
          persist-credentials: true

      - name: 非公開データをつなぐ
        run: |
          ln -sfn private/state state
          ln -sf private/discovered_sources.yml discovered_sources.yml

      - name: Python 3.12 の用意
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存の導入
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 日本語フォントの導入
        # runner には日本語フォントが無い。無いと紙面が豆腐になる（制約）。
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Playwright のキャッシュ
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Chromium の導入
        run: python -m playwright install --with-deps chromium

      - name: 朝の処理
        env:
          # APIキーがあればそちらを優先。片方だけでも動く。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main

      - name: 状態のcommit
        # 自分が書いた state を origin/main の最新へ JSON として併合してから push
        # する（scripts/push_state.sh）。rebase だと written.json の末尾追記どうしで
        # 必ず競合し、記録が消える（2026-10-01 に発生）。
        run: |
          cd private && ../scripts/push_state.sh "auto: state $(date +%F)" state/*.json discovered_sources.yml

      - name: やり直しの待ち行列があれば記事化を起動
        # 前日までに送れなかった・作れなかった記事を、本人が押し直さなくても作って送る。
        # GITHUB_TOKEN の repository_dispatch は別のワークフローを起動できる（例外扱い）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('state/outbox.json',encoding='utf-8')).get('redo') or []))" 2>/dev/null || echo 0)
          echo "やり直しの待ち行列: ${n}項目"
          if [ "$n" != "0" ]; then gh api "repos/$REPO/dispatches" -f event_type=articles-retry; fi
