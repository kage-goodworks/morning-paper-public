  - { id: openai_news,     type: rss, url: "https://openai.com/news/rss.xml",                            category: ai,       fulltext: false }
  - { id: google_ai,       type: rss, url: "https://blog.google/technology/ai/rss/",                     category: ai,       fulltext: false }
  - { id: itmedia_ai,      type: rss, url: "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml",               category: ai,       fulltext: false }
  - { id: hf_blog,         type: rss, url: "https://huggingface.co/blog/feed.xml",                       category: ai,       fulltext: false }

  # --- 言語・フレームワーク --------------------------------------------------
  - { id: rust_blog,       type: rss, url: "https://blog.rust-lang.org/feed.xml",                        category: lang,     fulltext: true  }
  - { id: go_blog,         type: rss, url: "https://go.dev/blog/feed.atom",                              category: lang,     fulltext: true  }
  - { id: python_insider,  type: rss, url: "https://pythoninsider.blogspot.com/feeds/posts/default",     category: lang,     fulltext: true  }
  - { id: ts_devblog,      type: rss, url: "https://devblogs.microsoft.com/typescript/feed/",            category: lang,     fulltext: true  }

  # --- 開発ツール・環境 ------------------------------------------------------
  - { id: github_blog,     type: rss, url: "https://github.blog/feed/",                                  category: devtools, fulltext: true  }
  - { id: github_change,   type: rss, url: "https://github.blog/changelog/feed/",                        category: devtools, fulltext: true  }
  - { id: vscode,          type: rss, url: "https://code.visualstudio.com/feed.xml",                     category: devtools, fulltext: false }
  - { id: gihyo,           type: rss, url: "https://gihyo.jp/feed/atom",                                 category: devtools, fulltext: false }

  # --- クラウド・インフラ ----------------------------------------------------
  - { id: aws_whatsnew,    type: rss, url: "https://aws.amazon.com/about-aws/whats-new/recent/feed/",     category: infra,    fulltext: false }
  - { id: cloudflare,      type: rss, url: "https://blog.cloudflare.com/rss/",                           category: infra,    fulltext: true  }
  - { id: kubernetes,      type: rss, url: "https://kubernetes.io/feed.xml",                             category: infra,    fulltext: false }
  - { id: postgresql,      type: rss, url: "https://www.postgresql.org/news.rss",                        category: infra,    fulltext: false }

  # --- 業界動向 -------------------------------------------------------------
  - { id: publickey,       type: rss, url: "https://www.publickey1.jp/atom.xml",                         category: industry, fulltext: false }
  - { id: techcrunch,      type: rss, url: "https://techcrunch.com/feed/",                               category: industry, fulltext: false }
  - { id: itmedia_news,    type: rss, url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml",          category: industry, fulltext: false }
  - { id: arstechnica,     type: rss, url: "https://feeds.arstechnica.com/arstechnica/index",            category: industry, fulltext: false }

  # --- セキュリティ ---------------------------------------------------------
